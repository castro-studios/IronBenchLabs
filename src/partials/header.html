<!-- header: {{home}} is "" on the homepage and "index.html" elsewhere -->
<div class="progress" aria-hidden="true"></div>
<header class="site-head">
    <div class="wrap site-head-in">
        <a class="brand" href="index.html" aria-label="IronBench Labs home">
            <span class="brand-mark" aria-hidden="true">IB</span>
            <span class="brand-name">IronBench<em>Labs</em></span>
        </a>
        <!-- @include nav.html -->
        <div class="head-actions">
            <button class="lights" id="theme-toggle" type="button" aria-label="Switch between light and dark">
                <span class="lights-ico" aria-hidden="true"></span><span class="lights-txt">Lights</span>
            </button>
            <a class="btn btn--sm" href="{{ctaHref}}">Get in touch</a>
            <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
        </div>
    </div>
</header>
