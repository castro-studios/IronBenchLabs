<!-- Obfuscated email: assembled client-side so the address never appears in raw HTML -->
<script>
    (function () {
        document.querySelectorAll('.ibl-email').forEach(function (a) {
            var user = a.getAttribute('data-user');
            var domain = a.getAttribute('data-domain');
            if (!user || !domain) return;
            var addr = user + '@' + domain;
            a.setAttribute('href', 'mailto:' + addr);
            a.textContent = addr;
        });
    })();
</script>
